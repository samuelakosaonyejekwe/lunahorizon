<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LunaHorizon · Lunar Mission Browser</title>
<meta name="description" content="Compare lunar landing sites and dates in seconds: Sun and Earth positions over real LOLA terrain horizons, solar power, battery and direct-to-Earth communication windows.">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LunaHorizon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="LunaHorizon">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/astro.js">
<link rel="modulepreload" href="js/engine.js">
<link rel="preload" href="data/sites.json" as="fetch" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash
  try { const t = JSON.parse(localStorage.getItem('lh.settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>

    <span>Luna<b>Horizon</b></span>

  <nav class="mainnav" aria-label="Main">
    <a href="#/map" data-nav="map">Site Map</a>
